  <p class="et-kicker">✦ &nbsp; NOTRE HISTOIRE</p>
  <h1>讓每一口甜，<br />閃耀成為值得記住的時光。</h1>
  <p class="et-french">Une douceur qui fait briller chaque instant.</p>
  <div class="et-copy">
